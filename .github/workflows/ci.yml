name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit tests (no database)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit

  integration-e2e:
    name: Integration and browser tests
    runs-on: ubuntu-24.04
    needs: checks
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: truedraft
          POSTGRES_PASSWORD: truedraft
          POSTGRES_DB: truedraft
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U truedraft" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://truedraft:truedraft@localhost:5432/truedraft
      TEST_DATABASE_URL: postgres://truedraft:truedraft@localhost:5432/truedraft_test
      APP_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
      # Fictional data only: the browser tests run the production build with the mock AI and a
      # file mailbox, which the startup guard allows only in explicit demo mode.
      TRUEDRAFT_DEMO_MODE: "true"
      AI_PROVIDER: mock
      MOCK_AI_DELAY_MS: "600"
      EMAIL_TRANSPORT: file
      AUTH_RATE_LIMIT: "off"
      ADMIN_EMAILS: admin@example.test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Generate throwaway secrets
        run: |
          echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ENCRYPTION_KEYS=ci1:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Create the test database
        run: PGPASSWORD=truedraft psql -h localhost -U truedraft -d truedraft -c "create database truedraft_test"
      - run: npm run test:integration
      - name: Prepare the app database
        run: npm run db:migrate && npm run db:seed && npm run scorecard:import && npm run cds:import
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
