name: Bug report
description: Report a reproducible problem with TrueDraft.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Use fictional examples. Remove API keys, sign-in links, personal essays, and private documents from attachments."
  - type: input
    id: version
    attributes:
      label: Version and environment
      description: Release tag or commit, operating system, and browser.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: What did you do, what happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or error details
      description: Optional; remove private information before sharing.
