<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TrueDraft · Anna</title>
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <p class="eyebrow">TRUEDRAFT / ANNA · BETA</p>
          <h1>Essay review · 文书反馈</h1>
        </div>
        <label
          >Interface / 界面<select id="locale">
            <option value="en">English</option>
            <option value="zh-CN">简体中文</option>
          </select></label
        >
      </header>
      <p id="principle"></p>
      <section id="gate">
        <h2 id="welcome"></h2>
        <p id="ageText"></p>
        <label
          ><input type="checkbox" id="adult" /><span id="adultText"></span
        ></label>
        <p>
          <a
            href="https://anna.partners/legal/terms"
            target="_blank"
            rel="noreferrer"
            >Anna Terms / 条款</a
          >
          ·
          <a
            href="https://anna.partners/legal/privacy"
            target="_blank"
            rel="noreferrer"
            >Anna Privacy / 隐私</a
          >
        </p>
        <button id="enter"></button>
      </section>
      <div id="workspace" hidden>
        <nav>
          <label
            ><span id="savedLabel"></span
            ><select id="saved"></select></label
          ><button id="open"></button><button id="new"></button
          ><button id="sample"></button>
        </nav>
        <div class="columns">
          <section>
            <h2 id="editorHeading"></h2>
            <label
              ><span id="promptLabel"></span
              ><textarea
                id="prompt"
                maxlength="4000"
                rows="4"
              ></textarea></label
            ><label
              ><span id="draftLabel"></span
              ><textarea id="draft" maxlength="20000" rows="15"></textarea>
            </label>
            <p id="counter"></p>
            <label
              ><span id="feedbackLanguage"></span
              ><select id="language">
                <option value="en">English</option>
                <option value="zh-CN">中文</option>
                <option value="bilingual">English + 中文</option>
              </select></label
            ><label
              ><span id="retentionLabel"></span
              ><select id="retention">
                <option value="30">30 days / 天</option>
                <option value="90">90 days / 天</option>
                <option value="365">365 days / 天</option>
              </select></label
            ><button id="save"></button
            ><label
              ><span id="historyLabel"></span
              ><select id="history"></select></label
            ><button id="restore"></button>
          </section>
          <section>
            <h2 id="reviewHeading"></h2>
            <details open>
              <summary id="privacyTitle"></summary>
              <p id="privacyText"></p>
              <p id="fees"></p>
            </details>
            <label
              ><input id="consent" type="checkbox" /><span
                id="consentText"
              ></span
            ></label>
            <div class="actions">
              <button id="analyze"></button
              ><button id="cancel" disabled></button>
            </div>
            <p id="status" role="status" aria-live="polite"></p>
            <p id="stale"></p>
            <div id="feedback"></div>
          </section>
        </div>
        <section>
          <h2 id="dataHeading"></h2>
          <p id="deletionText"></p>
          <div class="actions">
            <button id="export"></button><button id="delete"></button
            ><button id="deleteAll"></button><button id="exit"></button>
          </div>
          <label id="confirmRow" hidden
            ><input id="confirmDelete" type="checkbox" /><span
              id="confirmText"
            ></span
            ><button id="performDelete"></button
          ></label>
        </section>
      </div>
      <p id="notice" role="alert"></p>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
