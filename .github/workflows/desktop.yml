name: Desktop packages

on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: TrueDraft-Linux-x64.tar.gz
          - runner: ubuntu-24.04-arm
            artifact: TrueDraft-Linux-arm64.tar.gz
          - runner: windows-2025
            artifact: TrueDraft-Windows-x64.exe
          - runner: macos-15
            artifact: TrueDraft-macOS-arm64.zip
          - runner: macos-15-intel
            artifact: TrueDraft-macOS-x64.zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies with bundled native binaries
        run: npm ci --ignore-scripts
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress
      - run: npm run desktop:build
      - name: Install and test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $install = Join-Path $env:RUNNER_TEMP 'TrueDraft Install'
          $env:TRUEDRAFT_DESKTOP_DATA_DIR = Join-Path $env:RUNNER_TEMP 'TrueDraft Data'
          $installer = Start-Process -FilePath 'dist/TrueDraft-Windows-x64.exe' -ArgumentList "/S /D=$install" -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Installer failed: $($installer.ExitCode)" }
          foreach ($testArgs in @('--verify', '--verify --expect-existing')) {
            $test = Start-Process -FilePath "$install/TrueDraft.exe" -ArgumentList $testArgs -Wait -PassThru
            if ($test.ExitCode -ne 0) {
              Get-Content "$env:TRUEDRAFT_DESKTOP_DATA_DIR/desktop.log" -ErrorAction SilentlyContinue
              throw "Desktop smoke failed: $($test.ExitCode)"
            }
            if ($testArgs -eq '--verify') { node scripts/desktop/clear-test-catalog.mjs; if ($LASTEXITCODE -ne 0) { throw "Catalog reset failed" } }
          }
      - name: Extract and test on macOS
        if: runner.os == 'macOS'
        env:
          PACKAGE: ${{ matrix.artifact }}
        run: |
          ditto -x -k "dist/$PACKAGE" "$RUNNER_TEMP"
          codesign --verify --deep --strict "$RUNNER_TEMP/TrueDraft.app"
          export TRUEDRAFT_DESKTOP_DATA_DIR="$RUNNER_TEMP/TrueDraft Data"
          "$RUNNER_TEMP/TrueDraft.app/Contents/MacOS/TrueDraft" --verify
          node scripts/desktop/clear-test-catalog.mjs
          "$RUNNER_TEMP/TrueDraft.app/Contents/MacOS/TrueDraft" --verify --expect-existing
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

      - name: Extract and test on Linux
        if: runner.os == 'Linux'
        env:
          PACKAGE: ${{ matrix.artifact }}
        run: |
          tar -xzf "dist/$PACKAGE" -C "$RUNNER_TEMP"
          export TRUEDRAFT_DESKTOP_DATA_DIR="$RUNNER_TEMP/TrueDraft Data"
          "$RUNNER_TEMP/TrueDraft/TrueDraft" --verify
          node scripts/desktop/clear-test-catalog.mjs
          "$RUNNER_TEMP/TrueDraft/TrueDraft" --verify --expect-existing
          export XDG_DATA_HOME="$RUNNER_TEMP/Linux Menu"
          "$RUNNER_TEMP/TrueDraft/install.sh"
          test -f "$XDG_DATA_HOME/applications/TrueDraft.desktop"

  release:
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish verified downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd artifacts
          sha256sum *.exe *.zip *.tar.gz > SHA256SUMS.txt
          gh release create "$TAG" --verify-tag --title "TrueDraft ${TAG#desktop-}" --generate-notes ./*
